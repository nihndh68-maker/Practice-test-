<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IELTS Academic Reading · Practice Test</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(145deg, #1a2a4a 0%, #2d5a8e 50%, #1e3a5f 100%);
    padding: 24px;
  }
  .card {
    background: #fffef9;
    border-radius: 16px;
    padding: 40px 32px 32px;
    width: min(400px, 100%);
    box-shadow: 0 24px 60px rgba(0,0,0,.35);
    text-align: center;
  }
  .lock { font-size: 48px; margin-bottom: 12px; }
  h1 {
    font-family: 'Source Serif 4', serif;
    font-size: 22px;
    color: #2d5a8e;
    margin-bottom: 8px;
  }
  p {
    font-size: 14px;
    color: #6b6456;
    margin-bottom: 22px;
    line-height: 1.5;
  }
  input[type="password"] {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid #d6cfc0;
    border-radius: 8px;
    font-size: 16px;
    letter-spacing: 0.2em;
    text-align: center;
    margin-bottom: 10px;
    font-family: inherit;
    background: #fff;
  }
  input[type="password"]:focus {
    outline: none;
    border-color: #2d5a8e;
    box-shadow: 0 0 0 3px rgba(45,90,142,.15);
  }
  .error {
    font-size: 13px;
    color: #b94040;
    min-height: 20px;
    margin-bottom: 12px;
  }
  button {
    width: 100%;
    padding: 12px;
    background: #2d5a8e;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  button:hover { background: #234a75; }
  button:active { transform: scale(0.98); }
  #test-frame { display:none; position:fixed; inset:0; width:100%; height:100%; border:none; background:#fff; z-index:10; }
  body.unlocked .card { display:none; }
  body.unlocked { background:#fff; padding:0; }
</style>
</head>

      const bytes = DATA.match(/../g).map(function (x) { return parseInt(x, 16); });

        for (let j = 0; j < 64; j += 2) stream.push(parseInt(h.substr(j, 2), 16));

      let out = '';
      for (let i = 0; i < bytes.length; i++) out += String.fromCharCode(bytes[i] ^ stream[i]);

      btn.disabled = true; btn.textContent = 'Loading…';

        const bin = atob(PAGE_B64), bytes = new Uint8Array(bin.length);

        frame.srcdoc = new TextDecoder('utf-8').decode(bytes);
        frame.style.display = 'block';
        document.body.classList.add('unlocked');
      }, 30);
    }

        err.textContent = '';
        launch();
      } else {
        err.textContent = 'Incorrect password. Please try again.';
        input.value = '';
        input.focus();
      }
    }

    document.getElementById('pw').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        go();
      }
    });
  </script>
</body>
</html>
