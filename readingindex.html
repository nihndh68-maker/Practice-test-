<title>Reading Test</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  /* Layout: a header with progress, then five rows of ten test tiles (T1-T10 ... T41-T50) in a responsive grid. */
  :root {
    --bg: #f3f5f7;
    --surface: #ffffff;
    --ink: #14212b;
    --muted: #5b6b78;
    --line: #d5dce2;
    --accent: #0b5d7a;
    --accent-ink: #ffffff;
    --done: #1d7a4d;
    --done-bg: #e3f3ea;
    --tile-s: 72%; --ink-l: 36%; --bg-l: 94%; --line-l: 80%; --on-l: 98%;
    --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f171d; --surface: #17222a; --ink: #e6edf2; --muted: #93a4b1; --line: #2a3a45;
      --accent: #5cc0e0; --accent-ink: #0f171d; --done: #6fd39d; --done-bg: #17342a;
      --tile-s: 60%; --ink-l: 68%; --bg-l: 17%; --line-l: 30%; --on-l: 10%;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f171d; --surface: #17222a; --ink: #e6edf2; --muted: #93a4b1; --line: #2a3a45;
    --accent: #5cc0e0; --accent-ink: #0f171d; --done: #6fd39d; --done-bg: #17342a;
    --tile-s: 60%; --ink-l: 68%; --bg-l: 17%; --line-l: 30%; --on-l: 10%;
    color-scheme: dark;
  }
  .tile {
    --tile-ink: hsl(var(--h) var(--tile-s) var(--ink-l));
    --tile-bg: hsl(var(--h) var(--tile-s) var(--bg-l));
    --tile-line: hsl(var(--h) var(--tile-s) var(--line-l));
    --tile-on: hsl(var(--h) 40% var(--on-l));
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    padding-block: 32px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }

  header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; }
  header > div { min-width: 0; }
  .eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
  h1 { margin: 0; font-size: clamp(28px, 5vw, 40px); line-height: 1.1; font-weight: 700; text-wrap: balance; }
  .sub { margin: 8px 0 0; color: var(--muted); max-width: 52ch; }

  .progress { display: flex; flex-direction: column; gap: 8px; min-width: 200px; flex: 0 1 260px; }
  .progress-top { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
  .progress-top strong { color: var(--ink); font-size: 18px; font-variant-numeric: tabular-nums; }
  .bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .bar > span { display: block; height: 100%; width: 0; background: var(--done); transition: width .25s ease; }
  .reset { align-self: flex-start; font: inherit; font-size: 13px; color: var(--accent); background: none; border: 0; padding: 2px 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

  .row-group { display: flex; flex-direction: column; gap: 10px; }
  .row-label { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; margin: 0; }
  .grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
  @media (min-width: 720px) { .grid { grid-template-columns: repeat(10, minmax(0, 1fr)); } }

  .tile {
    position: relative;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 12px 4px 10px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--ink);
    font: inherit;
    cursor: pointer;
    transition: border-color .15s ease, transform .15s ease;
  }
  .tile:hover { border-color: var(--accent); transform: translateY(-2px); }
  .tile:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .tile { background: var(--tile-bg); border-color: var(--tile-line); }
  .tile:hover { border-color: var(--tile-ink); }
  .tile svg { width: 34px; height: 34px; color: var(--tile-ink); }
  .tile .num { color: var(--tile-ink); }
  .tile .num { font-family: var(--font-mono); font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; }
  .tile[data-done="true"] { background: var(--tile-ink); border-color: var(--tile-ink); }
  .tile[data-done="true"] svg, .tile[data-done="true"] .num { color: var(--tile-on); }
  .tile[data-done="true"] .tick { color: var(--tile-on); }
  .tile .tick circle { fill: currentColor; }
  .tile[data-done="true"] .tick path { stroke: var(--tile-ink); }
  .tile .tick { position: absolute; top: 5px; right: 5px; width: 14px; height: 14px; color: var(--done); display: none; }
  .tile[data-done="true"] .tick { display: block; }

  a.tile { text-decoration: none; }
  .tile.soon { opacity: .45; cursor: default; }
  .tile.soon:hover { transform: none; border-color: var(--tile-line); }
  .hint { color: var(--muted); font-size: 14px; margin: 0; }
  @media (prefers-reduced-motion: reduce) { .tile, .bar > span { transition: none; } .tile:hover { transform: none; } }
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="book" viewBox="0 0 32 32">
    <path d="M16 8.5C13.6 6.8 10 6 5 6v18c5 0 8.6.8 11 2.5C18.4 24.8 22 24 27 24V6c-5 0-8.600.8-11 2.500z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M16 8.5v18M8.500 11c1.800.1 3.400.4 4.500 1M8.500 15c1.800.1 3.400.4 4.500 1M19 12c1.100-.6 2.700-.9 4.500-1M19 16c1.100-.6 2.700-.9 4.500-1" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  </symbol>
  <symbol id="tick" viewBox="0 0 16 16">
    <circle cx="8" cy="8" r="8" fill="currentColor"/>
    <path d="M4.500 8.200l2.300 2.300 4.700-4.800" fill="none" stroke="#fff" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
</svg>

<div class="wrap">
  <header>
    <div>
      <p class="eyebrow">Index · T1 to T50</p>
      <h1>Reading Test</h1>
      <p class="sub">Fifty IELTS Academic Reading tests, one tile each. Tap a tile to open that test.</p>
    </div>
  </header>

  <main id="groups" class="wrap" style="gap:20px"></main>
</div>

<script>
(function () {
  var LIVE = 50; // each tile Tn opens Tn.html in the same folder as this page
  var groups = document.getElementById("groups");
  var tiles = [];
  for (var g = 0; g < 5; g++) {
    var from = g * 10 + 1, to = from + 9;
    var section = document.createElement("section");
    section.className = "row-group";
    var label = document.createElement("h2");
    label.className = "row-label";
    label.textContent = "T" + from + " – T" + to;
    var grid = document.createElement("div");
    grid.className = "grid";
    for (var n = from; n <= to; n++) {
      var live = n <= LIVE;
      var b = document.createElement(live ? "a" : "span");
      if (live) { b.href = "T" + n + ".html"; }
      else { b.setAttribute("aria-disabled", "true"); }
      b.className = "tile" + (live ? "" : " soon");
      b.id = "t" + n;
      b.dataset.n = n;
      b.style.setProperty("--h", Math.round((n - 1) * 360 / 50));
      b.setAttribute("aria-label", "Reading test T" + n + (live ? "" : ", coming soon"));
      b.innerHTML =
        '<svg aria-hidden="true"><use href="#book"/></svg>' +
        '<span class="num">T' + n + '</span>';
      grid.appendChild(b);
      tiles.push(b);
    }
    section.appendChild(label);
    section.appendChild(grid);
    groups.appendChild(section);
  }

})();
</script>
